<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=backspace"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="light change-theme">
    <div class="container light change-theme">
      <nav>
        <div class="header">
          <p class="light change-theme">Calculator</p>
        </div>
        <div class="themes">
          <button class="theme-btn">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </nav>
      <div class="input-text">
        <p class="data light change-theme"></p>
        <input class="light change-theme" type="text" placeholder="0" value="" />
      </div>
      <div class="cal-container">
        <button class="ac-btn">AC</button>
        <button class="modulus-btn operator light change-theme">%</button>
        <button class="backspace-btn light change-theme">
          <span class="material-symbols-outlined"> backspace </span>
        </button>
        <button class="divide-btn">
          <i class="fa-solid fa-divide"></i>
        </button>
        <button class="seven-btn number-btn light change-theme">7</button>
        <button class="eight-btn number-btn light change-theme">8</button>
        <button class="nine-btn number-btn light change-theme">9</button>
        <button class="mul-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="four-btn number-btn light change-theme">4</button>
        <button class="five-btn number-btn light change-theme">5</button>
        <button class="six-btn number-btn light change-theme">6</button>
        <button class="sub-btn">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="one-btn number-btn light change-theme">1</button>
        <button class="two-btn number-btn light change-theme">2</button>
        <button class="three-btn number-btn light change-theme">3</button>
        <button class="add-btn">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="dblzero-btn light change-theme">00</button>
        <button class="zero-btn light change-theme">0</button>
        <button class="dot-btn light change-theme">
          <i class="fa-solid fa-circle"></i>
        </button>
        <button class="equal-btn">
          <i class="fa-solid fa-equals"></i>
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
